basePath: /
definitions:
  dashcam.AlarmDTO:
    properties:
      alarm_id:
        type: string
      code:
        type: integer
      device_id:
        type: string
      gforce:
        description: |-
          Gforce is the reported acceleration magnitude for a driving-behaviour
          event, or null. Raw is the original VSS payload, exposed so FMS can
          confirm and back-fill the exact G field once a real event is seen.
        type: number
      id:
        type: integer
      lat:
        type: number
      lon:
        type: number
      occurred_at:
        type: string
      raw:
        type: object
      speed:
        type: number
    type: object
  dashcam.Clip:
    properties:
      channel:
        type: integer
      duration:
        type: integer
      lat:
        type: number
      lon:
        type: number
      path:
        type: string
      size:
        type: integer
      start:
        type: string
      stop:
        type: string
    type: object
  dashcam.DownloadRequest:
    properties:
      channel:
        type: integer
      path:
        description: the clip's device path, from a prior /videos call
        type: string
      start:
        description: '"2006-01-02 15:04:05"'
        type: string
      stop:
        type: string
    type: object
  dashcam.EvidenceClip:
    properties:
      channel:
        type: integer
      code:
        type: integer
      lat:
        type: number
      lon:
        type: number
      time:
        type: string
    type: object
  dashcam.TrackPoint:
    properties:
      lat:
        type: number
      lon:
        type: number
      time:
        type: string
    type: object
  ingest.GenericReading:
    properties:
      altitude:
        description: altitude -> metadata
        example: 20
        type: number
      bearing:
        description: heading degrees (float) -> bearing column
        example: 106.5
        type: number
      gpsCreatedAt:
        description: dateGps (device fix time) -> time column. received_at is stamped
          by the server, not sent here.
        example: "2026-07-10T06:12:29Z"
        type: string
      ignitionOn:
        description: ignition on/off -> ignition column
        example: false
        type: boolean
      imei:
        description: device IMEI (required)
        example: "864454076648348"
        type: string
      io:
        additionalProperties:
          type: string
        description: full vendor io blob -> metadata
        type: object
      latitude:
        description: GPS latitude  -> geom column
        example: -6.68211
        type: number
      longitude:
        description: GPS longitude -> geom column
        example: 111.4544916
        type: number
      sat:
        description: satellite count -> metadata
        example: 14
        type: integer
      speed:
        description: speed -> speed column
        example: 0
        type: number
    type: object
  ingest.GeofenceCheck:
    properties:
      center_lat:
        description: warehouse center latitude
        example: -6.2
        type: number
      center_lon:
        description: warehouse center longitude
        example: 106.8
        type: number
      driver:
        description: mobile-app driver id; its latest live position
        example: 649019ee6c7c280f4e46d0a2
        type: string
      imei:
        description: GPS tracker; its latest live position
        example: "350612071419004"
        type: string
      radius_m:
        description: optional; if set, `inside` = distance_m <= radius_m
        example: 8000
        type: number
    type: object
  ingest.GeofenceRequest:
    properties:
      checks:
        items:
          $ref: '#/definitions/ingest.GeofenceCheck'
        type: array
    type: object
  ingest.GeofenceResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/ingest.GeofenceResult'
        type: array
    type: object
  ingest.GeofenceResult:
    properties:
      distance_m:
        description: metres from the point to the center
        type: number
      driver:
        description: echoed from the request
        type: string
      found:
        description: false if neither identity has a live position
        type: boolean
      imei:
        description: echoed from the request
        type: string
      inside:
        description: present only when radius_m was given
        type: boolean
      lat:
        description: the position used
        type: number
      lon:
        type: number
      source:
        description: 'which identity supplied the position: "gps" | "mobile"'
        type: string
      time:
        description: fix time of that position
        type: string
    type: object
  ingest.GreenEvent:
    properties:
      duration_ms:
        type: integer
      event_type:
        description: 1 accel, 2 brake, 3 corner
        type: integer
      id:
        type: integer
      imei:
        type: string
      lat:
        type: number
      lon:
        type: number
      occurred_at:
        type: string
      speed:
        type: number
      value:
        description: |-
          Value is the raw Teltonika Green Driving Value (device units). FMS converts
          it to g for severity — it is NOT a g here.
        type: number
    type: object
  ingest.HistoryPage:
    properties:
      next_cursor:
        type: string
      points:
        items:
          type: object
        type: array
    type: object
  ingest.IngestResult:
    properties:
      stored:
        description: number of readings written
        example: 1
        type: integer
    type: object
  ingest.MobileHistoryPage:
    properties:
      next_cursor:
        type: string
      points:
        items:
          $ref: '#/definitions/ingest.MobilePosition'
        type: array
    type: object
  ingest.MobilePosition:
    properties:
      bearing:
        type: number
      driver:
        type: string
      jalan:
        type: string
      kabupaten:
        type: string
      kecamatan:
        type: string
      kelurahan:
        type: string
      kota:
        type: string
      lat:
        type: number
      lon:
        type: number
      metadata:
        type: object
      provinsi:
        type: string
      received_at:
        type: string
      speed:
        type: number
      time:
        type: string
    type: object
  ingest.MobileReading:
    properties:
      altitude:
        description: -> metadata
        example: 65
        type: number
      batteryLevel:
        description: 'Phone-specific conveniences: accepted top-level OR inside io;
          both land in metadata.'
        example: 41
        type: number
      bearing:
        description: -> bearing column
        example: 0
        type: number
      driver:
        description: driver id (required; identity)
        example: 649019ee6c7c280f4e46d0a2
        type: string
      fakeGps:
        type: boolean
      gpsCreatedAt:
        example: "2026-07-21T09:00:00Z"
        type: string
      gpsOn:
        type: boolean
      io:
        additionalProperties:
          type: string
        description: full app blob -> metadata
        type: object
      isOverride:
        type: boolean
      latitude:
        description: -> geom
        example: -6.9786741
        type: number
      longitude:
        description: -> geom
        example: 110.3701788
        type: number
      speed:
        description: -> speed column
        example: 0
        type: number
      status:
        example: Idle
        type: string
    type: object
  ingest.Position:
    properties:
      bearing:
        type: number
      ignition:
        type: boolean
      imei:
        type: string
      jalan:
        type: string
      kabupaten:
        type: string
      kecamatan:
        type: string
      kelurahan:
        type: string
      kota:
        type: string
      lat:
        type: number
      lon:
        type: number
      metadata:
        description: vendor io + extras (raw payload excluded)
        type: object
      provinsi:
        type: string
      received_at:
        type: string
      speed:
        type: number
      state_since:
        description: |-
          StateSince is when the device's drive state (moving / idle / parking)
          last changed — kept by the current-state upsert, so present on live
          reads only; null on history rows and on rows written before it existed.
        type: string
      time:
        description: gpsCreatedAt
        type: string
    type: object
  ingest.VehicleDay:
    properties:
      day:
        description: YYYY-MM-DD, Asia/Jakarta
        type: string
      distance_km:
        type: number
      first_seen:
        type: string
      idle_s:
        type: integer
      imei:
        type: string
      last_seen:
        type: string
      max_speed:
        type: number
      moving_s:
        type: integer
      parking_s:
        type: integer
      samples:
        type: integer
    type: object
info:
  contact: {}
  description: Multi-vendor device telemetry intake. Devices POST readings; each is
    reverse-geocoded (kecamatan/kota/provinsi) and stored to the telemetry hypertable
    keyed by IMEI.
  title: Karlo FMS Ingest Service
  version: "0.1"
paths:
  /v1/coverage:
    get:
      description: ~1.2km grid cells. metric=signal returns avg GSM signal (0-5) +
        dead-zone ratio (provider is a comma-separated subset, combined); metric=terrain
        returns ruggedness (metres of elevation change per km driven); metric=altitude
        returns mean elevation in metres. Optional bbox=minLon,minLat,maxLon,maxLat.
      parameters:
      - description: signal | terrain | altitude | lte (default signal)
        in: query
        name: metric
        type: string
      - description: 'comma-separated: telkomsel,indosat,xl — omit for every operator
          incl. unreported (signal only)'
        in: query
        name: provider
        type: string
      - description: 'comma-separated: 2g,4g — omit for both device generations (signal
          only)'
        in: query
        name: gen
        type: string
      - description: minLon,minLat,maxLon,maxLat
        in: query
        name: bbox
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Signal / terrain / altitude coverage grid (GeoJSON)
      tags:
      - coverage
  /v1/dashcams:
    get:
      description: Fronts the VSS device list. Tenant-agnostic; FMS maps devices to
        vehicles and scopes by tenant.
      parameters:
      - description: filter by device id/name
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: List dashcam devices and their online state
      tags:
      - dashcams
  /v1/dashcams/{deviceId}/download:
    post:
      consumes:
      - application/json
      description: Starts a VSS download, fetches the file, and stores it under karlo-fms-cold-storage/video/.
        Returns a job id to poll; the finished job carries the S3 key FMS records.
      parameters:
      - description: VSS device id
        in: path
        name: deviceId
        required: true
        type: string
      - description: clip to pull
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dashcam.DownloadRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: Pull a clip to S3 (async)
      tags:
      - dashcams
  /v1/dashcams/{deviceId}/evidence:
    get:
      description: Alarms that auto-uploaded an evidence clip, with their real time.
      parameters:
      - description: vss device id
        in: path
        name: deviceId
        required: true
        type: string
      - description: YYYY-MM-DD
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dashcam.EvidenceClip'
            type: array
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: A device's alarm evidence clips for a date
      tags:
      - dashcams
  /v1/dashcams/{deviceId}/live:
    get:
      parameters:
      - description: VSS device id
        in: path
        name: deviceId
        required: true
        type: string
      - description: channel list e.g. 1_2
        in: query
        name: channel
        type: string
      - description: main|sub (default sub)
        in: query
        name: stream
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: Embeddable live-view URL
      tags:
      - dashcams
  /v1/dashcams/{deviceId}/track:
    get:
      description: |-
        The device's GPS fixes, for a vehicle that has a camera but no
        tracker — so its trip history comes from the dashcam.
      parameters:
      - description: vss device id
        in: path
        name: deviceId
        required: true
        type: string
      - description: RFC3339
        in: query
        name: from
        required: true
        type: string
      - description: RFC3339
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dashcam.TrackPoint'
            type: array
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: A dashcam's own GPS track over a range
      tags:
      - dashcams
  /v1/dashcams/{deviceId}/videos:
    get:
      description: Clips on the device SD card for the given day. Each clip is annotated
        with the position the dashcam's own GPS reported at the clip's start (derived
        — the vendor's clip list carries no coordinate).
      parameters:
      - description: VSS device id
        in: path
        name: deviceId
        required: true
        type: string
      - description: YYYY-MM-DD
        in: query
        name: date
        required: true
        type: string
      - description: channel list e.g. 1_2 (default all)
        in: query
        name: channel
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dashcam.Clip'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: List a device's clips for a date, with coordinates
      tags:
      - dashcams
  /v1/dashcams/alarms:
    get:
      description: Events received over the VSS WebSocket, id-ascending. Poll with
        since=<last id you saw>. Tenant-agnostic; FMS maps device_id to a vehicle
        and raises its own alert.
      parameters:
      - description: return alarms with id greater than this (default 0)
        in: query
        name: since
        type: integer
      - description: max rows (default 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dashcam.AlarmDTO'
            type: array
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: Dashcam alarms since an id (for FMS to poll)
      tags:
      - dashcams
  /v1/dashcams/downloads/{jobId}:
    get:
      parameters:
      - description: job id
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: Poll a download job
      tags:
      - dashcams
  /v1/driving-events:
    get:
      description: Harsh accel/brake/corner events from Teltonika trackers, id-ascending.
        Poll with since=<last id>. Tenant-agnostic; FMS maps IMEI to a vehicle and
        scores it.
      parameters:
      - description: return events with id greater than this (default 0)
        in: query
        name: since
        type: integer
      - description: max rows (default 200)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ingest.GreenEvent'
            type: array
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: Tracker Green Driving events since an id (for FMS to poll)
      tags:
      - driving
  /v1/geofence/check:
    get:
      description: Distance of one truck (imei), one mobile driver (driver), or an
        arbitrary point (lat/lon) to a center. Pass both imei and driver to use whichever
        has the fresher live fix. Returns the same fields as one batch result.
      parameters:
      - description: Center latitude
        in: query
        name: center_lat
        required: true
        type: number
      - description: Center longitude
        in: query
        name: center_lon
        required: true
        type: number
      - description: Optional radius; sets `inside`
        in: query
        name: radius_m
        type: number
      - description: Test this truck's latest position (or use driver, or lat+lon)
        in: query
        name: imei
        type: string
      - description: Test this mobile driver's latest position
        in: query
        name: driver
        type: string
      - description: Test an arbitrary point (with lon)
        in: query
        name: lat
        type: number
      - description: Test an arbitrary point (with lat)
        in: query
        name: lon
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ingest.GeofenceResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: Single radius check (convenience/testing)
      tags:
      - geofence
    post:
      consumes:
      - application/json
      description: For each {imei and/or driver, center, radius}, returns the current
        distance to the center (and `inside` if radius given). Identity may be an
        `imei` (GPS tracker), a `driver` id (mobile app), or BOTH — send both when
        you don't know which is reporting and the freshest live fix wins; `source`
        tells you which was used. One request, one indexed lookup per identity type.
        The caller (platform) applies its own distance bands (arrive/out/enter) on
        distance_m. No live position → found:false.
      parameters:
      - description: Batch of checks (max 5000)
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/ingest.GeofenceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ingest.GeofenceResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: 'Batch radius check: are these trucks within their circles?'
      tags:
      - geofence
  /v1/history/{imei}:
    get:
      parameters:
      - description: Device IMEI
        in: path
        name: imei
        required: true
        type: string
      - description: Start time (RFC3339); default now-24h
        in: query
        name: from
        type: string
      - description: End time (RFC3339); default now
        in: query
        name: to
        type: string
      - description: Page size (default 1000, max 10000)
        in: query
        name: limit
        type: integer
      - description: Pass the previous response's next_cursor to get the next page
        in: query
        name: cursor
        type: string
      - description: Comma-separated columns to return (e.g. lat,lon,speed); omit
          for all. imei+time always included. Dropping metadata is the biggest speed/size
          win.
        in: query
        name: fields
        type: string
      - description: Downsample the whole range to ~N shape-preserving points (LTTB).
          When set, pagination is bypassed.
        in: query
        name: max_points
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ingest.HistoryPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: Historical track for a device over a time range
      tags:
      - read
  /v1/ingest:
    post:
      consumes:
      - application/json
      description: Accepts all readings, reverse-geocodes each to kecamatan/kota/provinsi,
        and stores them to the telemetry hypertable keyed by IMEI. Send one GenericReading
        object or a JSON array of them. Fields map to telemetry columns except those
        noted "-> metadata" (stored in the metadata jsonb).
      parameters:
      - description: A reading (or a JSON array of readings)
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/ingest.GenericReading'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/ingest.IngestResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      summary: Ingest device telemetry (single reading or batch array)
      tags:
      - ingest
  /v1/ingest/mobile:
    post:
      consumes:
      - application/json
      description: Same canonical shape as /v1/ingest but keyed by `driver` instead
        of `imei` (a phone has no IMEI). Each reading is reverse-geocoded to kecamatan/kelurahan/kota/provinsi/jalan
        and stored to the mobile_telemetry hypertable. received_at is stamped by the
        server. Phone extras (batteryLevel, accuracy, status, isOverride, …) go in
        `io` and are kept in metadata.
      parameters:
      - description: Array of readings (a single reading object is also accepted)
        in: body
        name: payload
        required: true
        schema:
          items:
            $ref: '#/definitions/ingest.MobileReading'
          type: array
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/ingest.IngestResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      summary: Ingest mobile-app telemetry (single reading or batch array)
      tags:
      - ingest
  /v1/live:
    get:
      description: 'Returns the latest fix per device. Use ?imeis= to restrict to
        a set, and ?fields= to trim columns (e.g. a lightweight map feed: ?fields=lat,lon).'
      parameters:
      - description: Comma-separated IMEIs to return (omit for all devices). Max 5000.
        in: query
        name: imeis
        type: string
      - description: Comma-separated columns to return (e.g. lat,lon,speed); omit
          for all. imei+time always included.
        in: query
        name: fields
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ingest.Position'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: Latest position of devices (all, or a specific set)
      tags:
      - read
  /v1/live/{imei}:
    get:
      parameters:
      - description: Device IMEI
        in: path
        name: imei
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ingest.Position'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: Latest position of one device
      tags:
      - read
  /v1/mobile/history/{driver}:
    get:
      parameters:
      - description: Driver id
        in: path
        name: driver
        required: true
        type: string
      - description: Start time (RFC3339); default now-24h
        in: query
        name: from
        type: string
      - description: End time (RFC3339); default now
        in: query
        name: to
        type: string
      - description: Page size (default 1000, max 10000)
        in: query
        name: limit
        type: integer
      - description: Pass the previous response's next_cursor
        in: query
        name: cursor
        type: string
      - description: Downsample the range to ~N shape-preserving points (LTTB); bypasses
          pagination
        in: query
        name: max_points
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ingest.MobileHistoryPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: Historical track for a mobile driver over a time range
      tags:
      - read
  /v1/mobile/live:
    get:
      description: Returns the latest phone fix per driver. Use ?drivers= to restrict
        to a set — fms-backend asks only for the drivers assigned to vehicles that
        have no tracker or camera fix.
      parameters:
      - description: Comma-separated driver ids to return (omit for all). Max 5000.
        in: query
        name: drivers
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ingest.MobilePosition'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: Latest position of mobile drivers (all, or a specific set)
      tags:
      - read
  /v1/mobile/live/{driver}:
    get:
      parameters:
      - description: Driver id
        in: path
        name: driver
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ingest.MobilePosition'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - IngestKey: []
      - ServiceToken: []
      summary: Latest position of one mobile driver
      tags:
      - read
  /v1/stats/daily:
    get:
      description: 'Pre-aggregated daily rollup: seconds moving/idle/parked, distance,
        max speed. Days are Asia/Jakarta.'
      parameters:
      - description: start day, YYYY-MM-DD (inclusive)
        in: query
        name: from
        required: true
        type: string
      - description: end day, YYYY-MM-DD (inclusive)
        in: query
        name: to
        required: true
        type: string
      - description: comma-separated IMEIs; omit for all
        in: query
        name: imeis
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ingest.VehicleDay'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Daily per-device time-in-state and distance
      tags:
      - stats
securityDefinitions:
  IngestKey:
    description: Per-vendor ingest key (minted with scripts/ingest-key.sh). Devices
      use it to POST; every read below requires it too.
    in: header
    name: X-Ingest-Key
    type: apiKey
  ServiceToken:
    description: Platform service token as "Bearer <token>" — for peer services (fms-api,
      TMS business-service) reading telemetry.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
