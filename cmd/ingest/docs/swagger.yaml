basePath: /
definitions:
  api.Vehicle:
    properties:
      id:
        type: integer
      make:
        type: string
      model:
        type: string
      plate_no:
        type: string
      status:
        type: string
    type: object
  geocode.Result:
    properties:
      cached:
        description: true if served from the Redis cache
        type: boolean
      found:
        type: boolean
      kabupaten:
        description: kota/kabupaten = the "city" level
        type: string
      kecamatan:
        type: string
      kecamatan_code:
        description: BPS P-code
        type: string
      lat:
        type: number
      lon:
        type: number
      provinsi:
        type: string
    type: object
info:
  contact: {}
  description: Multi-vendor device telemetry intake. Devices POST readings; registered
    IMEIs are normalized and stored to the telemetry hypertable.
  title: Karlo FMS Ingest Service
  version: "0.1"
paths:
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /reverse:
    get:
      parameters:
      - description: Latitude
        example: -6.1751
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude
        example: 106.8272
        in: query
        name: lon
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/geocode.Result'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reverse geocode a coordinate to kecamatan / kota / provinsi
      tags:
      - geocode
  /v1/ingest/{vendor}:
    post:
      consumes:
      - application/json
      description: Registered IMEIs are stored; unregistered ones are rejected. Partial
        batches store the registered readings and report the rest.
      parameters:
      - description: Vendor/adapter key (e.g. generic)
        in: path
        name: vendor
        required: true
        type: string
      - description: A reading, or an array of readings
        in: body
        name: payload
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ingest device telemetry (single reading or batch array)
      tags:
      - ingest
  /vehicles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.Vehicle'
            type: array
      summary: List vehicles
      tags:
      - vehicles
swagger: "2.0"
