basePath: /
info:
  contact: {}
  description: Multi-vendor device telemetry intake. Devices POST readings; each is
    reverse-geocoded (kecamatan/kota/provinsi) and stored to the telemetry hypertable
    keyed by IMEI.
  title: Karlo FMS Ingest Service
  version: "0.1"
paths:
  /v1/ingest/{vendor}:
    post:
      consumes:
      - application/json
      description: Accepts all readings, reverse-geocodes each (kecamatan/kota/provinsi),
        and stores to the telemetry hypertable keyed by IMEI.
      parameters:
      - description: Vendor/adapter key (e.g. generic)
        in: path
        name: vendor
        required: true
        type: string
      - description: A reading, or an array of readings
        in: body
        name: payload
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ingest device telemetry (single reading or batch array)
      tags:
      - ingest
swagger: "2.0"
