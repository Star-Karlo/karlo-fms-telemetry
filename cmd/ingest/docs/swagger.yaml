basePath: /
definitions:
  ingest.GenericReading:
    properties:
      altitude:
        description: altitude -> metadata
        example: 20
        type: number
      bearing:
        description: heading degrees -> bearing column
        example: 106
        type: number
      createdAt:
        description: dateCreated (server receive) -> received_at column
        example: "2026-07-10T13:12:31.530Z"
        type: string
      gpsCreatedAt:
        description: dateGps (device fix time) -> time column
        example: "2026-07-10T06:12:29Z"
        type: string
      ignitionOn:
        description: ignition on/off -> ignition column
        example: false
        type: boolean
      imei:
        description: device IMEI (required)
        example: "864454076648348"
        type: string
      io:
        additionalProperties:
          type: string
        description: full vendor io blob -> metadata
        type: object
      latitude:
        description: GPS latitude  -> geom column
        example: -6.68211
        type: number
      longitude:
        description: GPS longitude -> geom column
        example: 111.4544916
        type: number
      sat:
        description: satellite count -> metadata
        example: 14
        type: integer
      speed:
        description: speed -> speed column
        example: 0
        type: number
    type: object
  ingest.HistoryPage:
    properties:
      next_cursor:
        type: string
      points:
        items:
          $ref: '#/definitions/ingest.Position'
        type: array
    type: object
  ingest.IngestResult:
    properties:
      stored:
        description: number of readings written
        example: 1
        type: integer
    type: object
  ingest.Position:
    properties:
      bearing:
        type: number
      ignition:
        type: boolean
      imei:
        type: string
      kabupaten:
        type: string
      kecamatan:
        type: string
      kota:
        type: string
      lat:
        type: number
      lon:
        type: number
      metadata:
        description: vendor io + extras (raw payload excluded)
        type: object
      provinsi:
        type: string
      received_at:
        type: string
      speed:
        type: number
      time:
        description: gpsCreatedAt
        type: string
    type: object
info:
  contact: {}
  description: Multi-vendor device telemetry intake. Devices POST readings; each is
    reverse-geocoded (kecamatan/kota/provinsi) and stored to the telemetry hypertable
    keyed by IMEI.
  title: Karlo FMS Ingest Service
  version: "0.1"
paths:
  /v1/history/{imei}:
    get:
      parameters:
      - description: Device IMEI
        in: path
        name: imei
        required: true
        type: string
      - description: Start time (RFC3339); default now-24h
        in: query
        name: from
        type: string
      - description: End time (RFC3339); default now
        in: query
        name: to
        type: string
      - description: Page size (default 1000, max 10000)
        in: query
        name: limit
        type: integer
      - description: Pass the previous response's next_cursor to get the next page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ingest.HistoryPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Historical track for a device over a time range
      tags:
      - read
  /v1/ingest:
    post:
      consumes:
      - application/json
      description: Accepts all readings, reverse-geocodes each to kecamatan/kota/provinsi,
        and stores them to the telemetry hypertable keyed by IMEI. Send one GenericReading
        object or a JSON array of them. Fields map to telemetry columns except those
        noted "-> metadata" (stored in the metadata jsonb).
      parameters:
      - description: A reading (or a JSON array of readings)
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/ingest.GenericReading'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/ingest.IngestResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ingest device telemetry (single reading or batch array)
      tags:
      - ingest
  /v1/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ingest.Position'
            type: array
      summary: Latest position of every device
      tags:
      - read
  /v1/live/{imei}:
    get:
      parameters:
      - description: Device IMEI
        in: path
        name: imei
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ingest.Position'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Latest position of one device
      tags:
      - read
swagger: "2.0"
