basePath: /
definitions:
  geocode.Result:
    properties:
      Kota:
        description: city (empty if the ADM2 is a regency)
        type: string
      cached:
        description: true if served from the Redis cache
        type: boolean
      found:
        type: boolean
      jalan:
        description: nearest OSM street (empty if none within range)
        type: string
      kabupaten:
        description: regency (empty if the ADM2 is a city)
        type: string
      kecamatan:
        type: string
      kelurahan:
        description: village (empty until ADM4 data is loaded)
        type: string
      lat:
        type: number
      lon:
        type: number
      provinsi:
        type: string
    type: object
  ingest.GenericReading:
    properties:
      altitude:
        description: altitude -> metadata
        example: 20
        type: number
      bearing:
        description: heading degrees (float) -> bearing column
        example: 106.5
        type: number
      gpsCreatedAt:
        description: dateGps (device fix time) -> time column. received_at is stamped
          by the server, not sent here.
        example: "2026-07-10T06:12:29Z"
        type: string
      ignitionOn:
        description: ignition on/off -> ignition column
        example: false
        type: boolean
      imei:
        description: device IMEI (required)
        example: "864454076648348"
        type: string
      io:
        additionalProperties:
          type: string
        description: full vendor io blob -> metadata
        type: object
      latitude:
        description: GPS latitude  -> geom column
        example: -6.68211
        type: number
      longitude:
        description: GPS longitude -> geom column
        example: 111.4544916
        type: number
      sat:
        description: satellite count -> metadata
        example: 14
        type: integer
      speed:
        description: speed -> speed column
        example: 0
        type: number
    type: object
  ingest.HistoryPage:
    properties:
      next_cursor:
        type: string
      points:
        items:
          type: object
        type: array
    type: object
  ingest.IngestResult:
    properties:
      stored:
        description: number of readings written
        example: 1
        type: integer
    type: object
  ingest.Position:
    properties:
      bearing:
        type: number
      ignition:
        type: boolean
      imei:
        type: string
      jalan:
        type: string
      kabupaten:
        type: string
      kecamatan:
        type: string
      kelurahan:
        type: string
      kota:
        type: string
      lat:
        type: number
      lon:
        type: number
      metadata:
        description: vendor io + extras (raw payload excluded)
        type: object
      provinsi:
        type: string
      received_at:
        type: string
      speed:
        type: number
      time:
        description: gpsCreatedAt
        type: string
    type: object
info:
  contact: {}
  description: Multi-vendor device telemetry intake. Devices POST readings; each is
    reverse-geocoded (kecamatan/kota/provinsi) and stored to the telemetry hypertable
    keyed by IMEI.
  title: Karlo FMS Ingest Service
  version: "0.1"
paths:
  /reverse:
    get:
      parameters:
      - description: Latitude
        example: -6.1751
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude
        example: 106.8272
        in: query
        name: lon
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/geocode.Result'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reverse geocode a coordinate to kecamatan / kota / provinsi
      tags:
      - geocode
  /v1/history/{imei}:
    get:
      parameters:
      - description: Device IMEI
        in: path
        name: imei
        required: true
        type: string
      - description: Start time (RFC3339); default now-24h
        in: query
        name: from
        type: string
      - description: End time (RFC3339); default now
        in: query
        name: to
        type: string
      - description: Page size (default 1000, max 10000)
        in: query
        name: limit
        type: integer
      - description: Pass the previous response's next_cursor to get the next page
        in: query
        name: cursor
        type: string
      - description: Comma-separated columns to return (e.g. lat,lon,speed); omit
          for all. imei+time always included. Dropping metadata is the biggest speed/size
          win.
        in: query
        name: fields
        type: string
      - description: Downsample the whole range to ~N shape-preserving points (LTTB).
          When set, pagination is bypassed.
        in: query
        name: max_points
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ingest.HistoryPage'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Historical track for a device over a time range
      tags:
      - read
  /v1/ingest:
    post:
      consumes:
      - application/json
      description: Accepts all readings, reverse-geocodes each to kecamatan/kota/provinsi,
        and stores them to the telemetry hypertable keyed by IMEI. Send one GenericReading
        object or a JSON array of them. Fields map to telemetry columns except those
        noted "-> metadata" (stored in the metadata jsonb).
      parameters:
      - description: Shared ingest API key (required when the service is configured
          with one)
        in: header
        name: X-Ingest-Key
        type: string
      - description: A reading (or a JSON array of readings)
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/ingest.GenericReading'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/ingest.IngestResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ingest device telemetry (single reading or batch array)
      tags:
      - ingest
  /v1/live:
    get:
      description: 'Returns the latest fix per device. Use ?imeis= to restrict to
        a set, and ?fields= to trim columns (e.g. a lightweight map feed: ?fields=lat,lon).'
      parameters:
      - description: Comma-separated IMEIs to return (omit for all devices). Max 5000.
        in: query
        name: imeis
        type: string
      - description: Comma-separated columns to return (e.g. lat,lon,speed); omit
          for all. imei+time always included.
        in: query
        name: fields
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ingest.Position'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Latest position of devices (all, or a specific set)
      tags:
      - read
  /v1/live/{imei}:
    get:
      parameters:
      - description: Device IMEI
        in: path
        name: imei
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ingest.Position'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Latest position of one device
      tags:
      - read
swagger: "2.0"
