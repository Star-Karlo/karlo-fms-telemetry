basePath: /
definitions:
  geocode.Address:
    properties:
      kabupaten:
        type: string
      kecamatan:
        type: string
      kelurahan:
        type: string
      provinsi:
        type: string
    type: object
  geocode.Candidate:
    properties:
      address:
        $ref: '#/definitions/geocode.Address'
      kind:
        description: road | kelurahan | kecamatan | kabupaten
        type: string
      label:
        description: display string, composed once for every caller
        type: string
      lat:
        type: number
      lon:
        type: number
      name:
        type: string
      score:
        description: 0..1 match quality
        type: number
    type: object
  geocode.Result:
    properties:
      Kota:
        description: city (empty if the ADM2 is a regency)
        type: string
      cached:
        description: true if served from the Redis cache
        type: boolean
      found:
        type: boolean
      jalan:
        description: nearest OSM street (empty if none within range)
        type: string
      kabupaten:
        description: regency (empty if the ADM2 is a city)
        type: string
      kecamatan:
        type: string
      kelurahan:
        description: village (empty until ADM4 data is loaded)
        type: string
      lat:
        type: number
      lon:
        type: number
      provinsi:
        type: string
    type: object
  routecache.Answer:
    properties:
      cached:
        type: boolean
      cached_at:
        type: string
      hits:
        type: integer
      payload:
        type: object
      source:
        description: mapid — the provider that produced it
        type: string
    type: object
  routecache.PurgeRequest:
    properties:
      lat:
        type: number
      location_id:
        description: LocationID drops every journey naming this id.
        type: string
      lon:
        description: |-
          Lon/Lat/RadiusM drops every journey with a point within the radius
          (default 200 m) — the coordinate equivalent.
        type: number
      radius_m:
        type: number
    type: object
  routecache.RouteIDsRequest:
    properties:
      location_ids:
        description: 'LocationIDs: exactly two, loading point first.'
        items:
          type: string
        type: array
    type: object
  routecache.RouteRequest:
    properties:
      points:
        description: |-
          Points are [lon, lat] in TRAVEL ORDER — MAPID's order, and the order
          the cache keys on.
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
      profile:
        description: truck (default) | car | motorcycle | foot
        type: string
    type: object
info:
  contact: {}
  description: 'Two jobs behind one process: geocoding (lat/lon -> kecamatan / kota
    / provinsi, PostGIS + Redis geohash cache; /search for forward lookups) and the
    platform''s routing cache (/v1/route, /v1/route-toll — MAPID''s answers kept 90
    days in Postgres so the same lane is never bought twice). They share a service
    because they share a database and a deploy, not because they are the same thing:
    geocode answers from our own data, routing caches somebody else\''s.'
  title: Karlo FMS Geocode Service
  version: "0.1"
paths:
  /reverse:
    get:
      parameters:
      - description: Latitude
        example: -6.1751
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude
        example: 106.8272
        in: query
        name: lon
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/geocode.Result'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reverse geocode a coordinate to kecamatan / kota / provinsi
      tags:
      - geocode
  /search:
    get:
      description: 'Searches the service''s own road and administrative-area data
        (no external provider). "Jl. Raya Bekasi, Cikarang Utara": the part before
        the first comma is the road or area, the rest narrows the area. Roads first,
        then kelurahan / kecamatan / kabupaten. Not house-number precise. Requires
        a platform service token as Bearer.'
      parameters:
      - description: query, at least 3 characters
        example: Jl. Raya Bekasi, Cikarang
        in: query
        name: q
        required: true
        type: string
      - description: max candidates (default 10, max 25)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/geocode.Candidate'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ServiceToken: []
      summary: 'Forward geocode: an address or place name to candidate pins (Indonesia)'
      tags:
      - geocode
  /v1/route:
    post:
      consumes:
      - application/json
      description: MAPID's routing answer for these points, served from the shared
        cache when it has been asked before and bought upstream when it has not. For
        a journey whose FARE you also need, call /v1/route-toll instead — its answer
        already contains the route. The response carries MAPID's payload untouched
        under `payload`, plus whether it was cached. Points are [lon, lat] in travel
        order; order is part of the identity, so A→B and B→A are different journeys.
      parameters:
      - description: points + profile
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routecache.RouteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routecache.Answer'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: MAPID refused or was unreachable; its own message is passed
            through
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ServiceToken: []
      summary: Route between points (cached)
      tags:
      - routing
  /v1/route-cache/purge:
    post:
      consumes:
      - application/json
      description: A cached answer is only as true as the place it was computed for.
        Coordinates change when a warehouse moves, so those entries simply go unused
        — but a LOCATION ID does not change, and would keep serving the route to where
        the warehouse used to be until it expires. Call this with the id when a location
        moves, or with lon/lat (+radius, default 200 m) to drop every journey touching
        a point.
      parameters:
      - description: location_id, or lon+lat
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routecache.PurgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"purged\": n}'
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ServiceToken: []
      summary: Drop cached journeys for a place that has moved
      tags:
      - routing
  /v1/route-ids:
    post:
      consumes:
      - application/json
      description: MAPID's /v4/route, which takes Karlo's own location ids registered
        with MAPID rather than coordinates — it may know a yard or gate centroid that
        a dropped pin does not hit, so its answer can differ from the coordinate route
        for the same pair. Cached on the id pair, which is a steadier key than coordinates.
        A pair MAPID does not recognise comes back 502 and is not cached, so a caller
        can fall back to /v1/route exactly as it does today. If a location MOVES,
        call /v1/route-cache/purge with its id — the id does not change when the place
        does.
      parameters:
      - description: two location ids, loading point first
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routecache.RouteIDsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routecache.Answer'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ServiceToken: []
      summary: Route between two Karlo location ids (cached)
      tags:
      - routing
  /v1/route-toll:
    post:
      consumes:
      - application/json
      description: 'As /v1/route, with MAPID''s toll pricing. IF YOU NEED BOTH THE
        ROUTE AND THE FARE, CALL ONLY THIS: the payload carries `route`, `distance`
        and `eta` alongside `prices`, so asking /v1/route as well buys a second answer
        for something you already have — and one computation means the fare and the
        geometry cannot describe slightly different roads. `prices` is the total per
        golongan, the figure to use; `details` are the gates as evidence, naming both
        ends of each segment, and their prices are a partition of the total rather
        than charges to add up. All five golongan come back in one answer, so the
        caller picks its class and the cache holds one entry per journey rather than
        five.'
      parameters:
      - description: points + profile
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routecache.RouteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routecache.Answer'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ServiceToken: []
      summary: Route with toll fares (cached)
      tags:
      - routing
securityDefinitions:
  ServiceToken:
    description: Platform service token as "Bearer <token>" — required for /search
      and for every routing endpoint (they front a PAID upstream). /reverse stays
      open.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
