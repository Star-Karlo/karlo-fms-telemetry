basePath: /
definitions:
  geocode.Address:
    properties:
      kabupaten:
        type: string
      kecamatan:
        type: string
      kelurahan:
        type: string
      provinsi:
        type: string
    type: object
  geocode.Candidate:
    properties:
      address:
        $ref: '#/definitions/geocode.Address'
      kind:
        description: road | kelurahan | kecamatan | kabupaten
        type: string
      label:
        description: display string, composed once for every caller
        type: string
      lat:
        type: number
      lon:
        type: number
      name:
        type: string
      score:
        description: 0..1 match quality
        type: number
    type: object
  geocode.Result:
    properties:
      Kota:
        description: city (empty if the ADM2 is a regency)
        type: string
      cached:
        description: true if served from the Redis cache
        type: boolean
      found:
        type: boolean
      jalan:
        description: nearest OSM street (empty if none within range)
        type: string
      kabupaten:
        description: regency (empty if the ADM2 is a city)
        type: string
      kecamatan:
        type: string
      kelurahan:
        description: village (empty until ADM4 data is loaded)
        type: string
      lat:
        type: number
      lon:
        type: number
      provinsi:
        type: string
    type: object
  routecache.APIError:
    properties:
      error:
        example: 'mapid: HTTP 400: out of bounds'
        type: string
    type: object
  routecache.GeoJSONLine:
    properties:
      coordinates:
        description: |-
          Coordinates are [lon, lat] pairs along the line, e.g.
          [[106.8272,-6.1754], [106.8291,-6.1802], … , [110.4381,-7.0051]].
        items:
          items:
            type: number
          type: array
        type: array
      type:
        example: LineString
        type: string
    type: object
  routecache.GeoJSONPoint:
    properties:
      coordinates:
        example:
        - 106.815531
        - -6.2236949
        items:
          type: number
        type: array
      type:
        example: Point
        type: string
    type: object
  routecache.PurgeRequest:
    properties:
      lat:
        example: -6.1754
        type: number
      location_id:
        description: LocationID drops every journey naming this id.
        example: LOC-JKT-01
        type: string
      lon:
        description: |-
          Lon/Lat/RadiusM drops every journey with a point within the radius
          (default 200 m) — the coordinate equivalent.
        example: 106.8272
        type: number
      radius_m:
        example: 200
        type: number
    type: object
  routecache.RouteAnswer:
    properties:
      cached:
        example: true
        type: boolean
      cached_at:
        example: "2026-09-28T04:12:07Z"
        type: string
      hits:
        example: 37
        type: integer
      payload:
        $ref: '#/definitions/routecache.RoutePayload'
      source:
        example: mapid
        type: string
    type: object
  routecache.RouteIDsRequest:
    properties:
      location_ids:
        description: 'LocationIDs: exactly two, loading point first.'
        example:
        - LOC-JKT-01
        - LOC-SMG-04
        items:
          type: string
        type: array
    type: object
  routecache.RoutePath:
    properties:
      ascend:
        example: 1204.5
        type: number
      bbox:
        example:
        - 106.815
        - -7.005
        - 110.438
        - -6.175
        items:
          type: number
        type: array
      descend:
        example: 1198.2
        type: number
      distance:
        example: 445023.495
        type: number
      points:
        $ref: '#/definitions/routecache.GeoJSONLine'
      points_encoded:
        example: false
        type: boolean
      time:
        example: 20009019
        type: integer
    type: object
  routecache.RoutePayload:
    properties:
      paths:
        items:
          $ref: '#/definitions/routecache.RoutePath'
        type: array
    type: object
  routecache.RouteRequest:
    properties:
      alternatives:
        description: |-
          Alternatives asks for up to N routes (2 or 3) instead of one. Only
          for a journey of exactly two points; with a waypoint the request is
          refused rather than quietly answered with a single route.
        example: 3
        type: integer
      elevation:
        description: Elevation adds a third value to every coordinate.
        example: false
        type: boolean
      instructions:
        description: |-
          Instructions asks for turn-by-turn steps. Off by default — they are
          about a tenth of the answer and most callers never read them.
        example: false
        type: boolean
      points:
        description: |-
          Points are [lon, lat] in TRAVEL ORDER (the order MAPID takes, and the
          order the cache keys on). At least two; waypoints are allowed.
          e.g. [[106.8272,-6.1754], [110.4381,-7.0051]] — Jakarta to Semarang.
        items:
          items:
            type: number
          type: array
        type: array
      profile:
        description: 'Profile: truck (the default), car, motorcycle or foot.'
        example: truck
        type: string
      snap_preventions:
        description: |-
          SnapPreventions keeps the route off the named road kinds, e.g.
          ["motorway","ferry","tunnel"]. Order does not matter.
        example:
        - ferry
        - tunnel
        items:
          type: string
        type: array
    type: object
  routecache.TollAnswer:
    properties:
      cached:
        example: false
        type: boolean
      cached_at:
        example: "2026-09-28T04:12:07Z"
        type: string
      hits:
        example: 12
        type: integer
      payload:
        $ref: '#/definitions/routecache.TollPayload'
      source:
        example: mapid
        type: string
    type: object
  routecache.TollGateEnd:
    properties:
      gate:
        example: in
        type: string
      geometry:
        $ref: '#/definitions/routecache.GeoJSONPoint'
      name:
        example: Cikampek Utama 1
        type: string
      prepaid:
        example: true
        type: boolean
    type: object
  routecache.TollPayload:
    properties:
      bbox:
        example:
        - 106.815
        - -7.005
        - 110.438
        - -6.175
        items:
          type: number
        type: array
      details:
        items:
          $ref: '#/definitions/routecache.TollSegment'
        type: array
      distance:
        example: 445023.495
        type: number
      eta:
        example: 2670.14
        type: number
      prices:
        $ref: '#/definitions/routecache.TollPrices'
      route:
        $ref: '#/definitions/routecache.GeoJSONLine'
    type: object
  routecache.TollPrices:
    properties:
      golongan_1:
        example: 432000
        type: integer
      golongan_2:
        example: 665500
        type: integer
      golongan_3:
        example: 665500
        type: integer
      golongan_4:
        example: 874500
        type: integer
      golongan_5:
        example: 874500
        type: integer
    type: object
  routecache.TollSegment:
    properties:
      from:
        $ref: '#/definitions/routecache.TollGateEnd'
      price:
        $ref: '#/definitions/routecache.TollPrices'
      to:
        $ref: '#/definitions/routecache.TollGateEnd'
    type: object
info:
  contact: {}
  description: 'Two jobs behind one process: geocoding (lat/lon -> kecamatan / kota
    / provinsi, PostGIS + Redis geohash cache; /search for forward lookups) and the
    platform''s routing cache (/v1/route, /v1/route-toll, /v1/route-ids — answers
    kept 90 days in Postgres so the same lane is never bought twice). Routing has
    two possible engines and every answer names the one that produced it in `source`:
    MAPID, which is metered, and Karlo''s own self-hosted Valhalla, which is free
    per call but answers coordinate routing only — id-routed journeys and toll fares
    stay on MAPID. ROUTE_ENGINE picks it at deploy time; callers see the same endpoints
    and shapes either way.'
  title: Karlo FMS Geocode Service
  version: "0.1"
paths:
  /reverse:
    get:
      parameters:
      - description: Latitude
        example: -6.1751
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude
        example: 106.8272
        in: query
        name: lon
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/geocode.Result'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reverse geocode a coordinate to kecamatan / kota / provinsi
      tags:
      - geocode
  /search:
    get:
      description: 'Searches the road and administrative-area data held by this service
        (no external provider). "Jl. Raya Bekasi, Cikarang Utara": the part before
        the first comma is the road or area, the rest narrows the area. Roads first,
        then kelurahan / kecamatan / kabupaten. Not house-number precise. Requires
        a platform service token as Bearer.'
      parameters:
      - description: query, at least 3 characters
        example: Jl. Raya Bekasi, Cikarang
        in: query
        name: q
        required: true
        type: string
      - description: max candidates (default 10, max 25)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/geocode.Candidate'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ServiceToken: []
      summary: 'Forward geocode: an address or place name to candidate pins (Indonesia)'
      tags:
      - geocode
  /v1/route:
    post:
      consumes:
      - application/json
      description: 'The routing answer for these points, served from the shared cache
        when it has been asked before and fetched upstream when it has not. `source`
        names the engine that produced it — `mapid` (metered) or `valhalla` (Karlo''s
        own, free per call); a deployment chooses one and the request shape does not
        change. Options (instructions, elevation, alternatives, snap_preventions)
        are part of the identity of a request: the same journey asked with different
        options is a different cached answer, so ask for what you will read and no
        more. For a journey whose FARE you also need, call /v1/route-toll instead
        — its answer already contains the route. The response carries the MAPID payload
        untouched under `payload`, plus whether it was cached. Points are [lon, lat]
        in travel order; order is part of the identity, so A→B and B→A are different
        journeys.'
      parameters:
      - description: points + profile
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routecache.RouteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routecache.RouteAnswer'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routecache.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/routecache.APIError'
        "502":
          description: MAPID refused or was unreachable; its own message is passed
            through
          schema:
            $ref: '#/definitions/routecache.APIError'
      security:
      - ServiceToken: []
      summary: Route between points (cached)
      tags:
      - routing
  /v1/route-cache/purge:
    post:
      consumes:
      - application/json
      description: A cached answer is only as true as the place it was computed for.
        Coordinates change when a warehouse moves, so those entries simply go unused
        — but a LOCATION ID does not change, and would keep serving the route to where
        the warehouse used to be until it expires. Call this with the id when a location
        moves, or with lon/lat (+radius, default 200 m) to drop every journey touching
        a point.
      parameters:
      - description: location_id, or lon+lat
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routecache.PurgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"purged\": n}'
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ServiceToken: []
      summary: Drop cached journeys for a place that has moved
      tags:
      - routing
  /v1/route-ids:
    post:
      consumes:
      - application/json
      description: the /v4/route endpoint, which takes Karlo location ids registered
        with MAPID rather than coordinates — it may know a yard or gate centroid that
        a dropped pin does not hit, so its answer can differ from the coordinate route
        for the same pair. Cached on the id pair, which is a steadier key than coordinates.
        A pair MAPID does not recognise comes back 502 and is not cached, so a caller
        can fall back to /v1/route exactly as it does today. If a location MOVES,
        call /v1/route-cache/purge with its id — the id does not change when the place
        does.
      parameters:
      - description: two location ids, loading point first
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routecache.RouteIDsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routecache.RouteAnswer'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routecache.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/routecache.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/routecache.APIError'
      security:
      - ServiceToken: []
      summary: Route between two Karlo location ids (cached)
      tags:
      - routing
  /v1/route-toll:
    post:
      consumes:
      - application/json
      description: 'As /v1/route, with toll pricing from MAPID. IF YOU NEED BOTH THE
        ROUTE AND THE FARE, CALL ONLY THIS: the payload carries `route`, `distance`
        and `eta` alongside `prices`, so asking /v1/route as well buys a second answer
        for something you already have — and one computation means the fare and the
        geometry cannot describe slightly different roads. `prices` is the total per
        golongan, the figure to use; `details` are the gates as evidence, naming both
        ends of each segment, and their prices are a partition of the total rather
        than charges to add up. All five golongan come back in one answer, so the
        caller picks its class and the cache holds one entry per journey rather than
        five.'
      parameters:
      - description: points + profile
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/routecache.RouteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/routecache.TollAnswer'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/routecache.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/routecache.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/routecache.APIError'
      security:
      - ServiceToken: []
      summary: Route with toll fares (cached)
      tags:
      - routing
securityDefinitions:
  ServiceToken:
    description: Platform service token as "Bearer <token>" — required for /search
      and for every routing endpoint (they front a PAID upstream). /reverse stays
      open.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
