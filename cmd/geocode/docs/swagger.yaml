basePath: /
definitions:
  geocode.Result:
    properties:
      cached:
        description: true if served from the Redis cache
        type: boolean
      found:
        type: boolean
      kabupaten:
        description: kota/kabupaten = the "city" level
        type: string
      kecamatan:
        type: string
      kecamatan_code:
        description: BPS P-code
        type: string
      lat:
        type: number
      lon:
        type: number
      provinsi:
        type: string
    type: object
info:
  contact: {}
  description: 'Reverse geocoding: lat/lon -> kecamatan / kota / provinsi (PostGIS
    + Redis geohash cache).'
  title: Karlo FMS Geocode Service
  version: "0.1"
paths:
  /reverse:
    get:
      parameters:
      - description: Latitude
        example: -6.1751
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude
        example: 106.8272
        in: query
        name: lon
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/geocode.Result'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reverse geocode a coordinate to kecamatan / kota / provinsi
      tags:
      - geocode
swagger: "2.0"
