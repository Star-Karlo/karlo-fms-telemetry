services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fms
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  # Reverse-geocode service. Opt-in: `make up-app` (profile "app"); plain
  # `make up` starts only the infra above (db + redis) for local `go run`.
  geocode:
    build:
      context: .
      args:
        SERVICE: geocode
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/fms
      REDIS_ADDR: redis:6379
      GEOCODE_ADDR: ":8081"
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["app"]

volumes:
  dbdata:
  redisdata:
